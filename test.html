<style>
    .available {
        min-height: 150px;
        border: 2px dashed #ccc;
        padding: 10px;
        border-radius: 10px;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .slot.hovered,
    #available-cards.hovered {
      border-color: #007bff;
    }

    .slot {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 20px;
      width: 300px;
      min-height: 150px;
      margin: 20px;
      float: left;
      text-align: center;
      transition: border-color 0.3s;
    }
  
    .slot.hovered {
      border-color: #4CAF50;
    }
  
    .card {
      background: #f4f4f4;
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      cursor: grab;
    }
  </style>
  
  <div id="interface-list"></div>
  
  <div id="available-cards" class="available">
    <!-- les cartes seront ici par défaut -->
  </div>
  
  <div style="display:flex;">
    <div class="slot" id="slot-modbus" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
      <h3>Modbus TCP</h3>
    </div>
    <div class="slot" id="slot-internet" ondrop="drop(event)" ondragover="allowDrop(event)"  ondragleave="leaveDrop(event)">
      <h3>Internet</h3>
    </div>
  </div>
  
  <script>
    // Simuler le retour de getNetworkSettings()
    const interfaces = [
  { ipadress: "10.66.66.2", description: "malowgPC", subnetmask : "255.255.255.255", gateway : "On-link" },
  { ipadress: "192.168.1.13", description: "Wi-Fi", subnetmask : "255.255.255.0", gateway : "192.168.1.1"  }
];

    const availableContainer = document.getElementById("available-cards");

    interfaces.forEach((net, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.draggable = true;
        card.id = `card-${index}`;
        card.innerHTML = `
            <p><strong>${net.description || "Unknown"}</strong></p>
            <p>${net.ipadress}</p>
            <p>${net.subnetmask}</p>
            <p>${net.gateway}</p>
        `;
        card.addEventListener("dragstart", drag);
        availableContainer.appendChild(card);
    });

  
    function allowDrop(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.add("hovered");
    }

    function leaveDrop(ev) {
        ev.currentTarget.classList.remove("hovered");
    }

    function drag(ev) {
        ev.dataTransfer.setData("text/plain", ev.target.id);
    }

    function drop(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.remove("hovered");

        const cardId = ev.dataTransfer.getData("text/plain");
        const card = document.getElementById(cardId);
        const currentContainer = ev.currentTarget;

        // Vérifie s’il y a déjà une carte dans le slot
        const existingCard = currentContainer.querySelector(".card");
        if (existingCard) {
            // Renvoie l’ancienne carte dans la zone dispo
            document.getElementById("available-cards").appendChild(existingCard);
        }

        // Ajoute la carte au slot
        currentContainer.appendChild(card);

        // Ajoute l'attribut d'usage à la carte selon le slot
        const usage = currentContainer.id === "modbus-slot" ? "modbus" : "internet";
        card.dataset.usage = usage;
    }

    document.getElementById("network-form").addEventListener("submit", function (event) {
        event.preventDefault();
        
        // On prépare la config des interfaces
        const configData = [
            {
            identification: "configuration",
            description: "This network configuration will be used to serve the configuration webserver",
            ipadress: document.getElementById("ip-0").value,
            subnetmask: document.getElementById("subnet-0").value,
            gateway: document.getElementById("gateway-0").value,
            dns: document.getElementById("dns-0").value,
            dhcp: document.getElementById("dhcp-0").value,
            usage: document.querySelector("#modbus-slot .card") ? document.querySelector("#modbus-slot .card").dataset.usage : null
            },
            {
            identification: "internet",
            description: "This network configuration will be used to access Netilion and the NTP clock server",
            ipadress: document.getElementById("ip-1").value,
            subnetmask: document.getElementById("subnet-1").value,
            gateway: document.getElementById("gateway-1").value,
            dns: document.getElementById("dns-1").value,
            dhcp: document.getElementById("dhcp-1").value,
            usage: document.querySelector("#internet-slot .card") ? document.querySelector("#internet-slot .card").dataset.usage : null
            }
        ];

        fetch("/api/save_networks_config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(configData)
        }).then(response => response.json())
            .then(data => {
            if (data.status === "success") {
                alert("✅ Configuration réseaux enregistrée !");
            } else {
                alert("❌ Erreur lors de l'enregistrement !");
            }
            });
    });
    
  </script>
