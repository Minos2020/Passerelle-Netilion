{% extends "base.html" %}
{% block title %}Comptes Netilion{% endblock %}

{% block extra_styles %}
  <style>
    #accounts-container {
      place-content: center;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 40px 10px;
    }
  
    .account-box {
      display: grid;
      grid-template-columns: 1fr 2fr;
      grid-gap: 5px;
      width: min-content;
      border: 1px solid #ccc;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
  
    .account-box:hover {
      transform: translateY(-5px);
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
    }
  
    .grid-value {
      background: #fafafa;
      text-align: center;
      width: auto;
      padding: 5px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

      
  </style>
  {% endblock %}

  {% block extra_scripts %}
  <script>
    let accounts = [];


    function fetchAccounts() {
      fetch("/api/get_accounts")
        .then(response => response.json())
        .then(data => {
          accounts = data;
          renderAccounts();
        });
    }

    function renderAccounts() {
      let container = document.getElementById("accounts-container");
      container.innerHTML = ""; // Clear before rendering
     
      accounts.forEach((account, index) => {
        let div = document.createElement("div");
        div.classList.add("account-box");
        div.innerHTML = `
          <div class="grid-key">N° de compte</div><div class="grid-value" style="background: none; border: none;">${account.account_id}</div>
          <div class="grid-key">Identification:</div>
          <input class="grid-value" type="text" value="${account.identification}" onchange="updateAccount(${index}, 'identification', this.value)">
          
          <div class="grid-key">Account email:</div>
          <input class="grid-value" title="Doit être renseigné afin que les assets créés depuis la passerelle soient accessibles directement depuis l'interface Netilion"
          type="text" value="${account.email}" onchange="updateAccount(${index}, 'email', this.value)">

          <div class="grid-key">Client ID:</div>
          <input class="grid-value" type="text" value="${account.client_id}" onchange="updateAccount(${index}, 'client_id', this.value)">
          
          <div class="grid-key">Client Secret:</div>
          <input class="grid-value" type="password" value="${account.client_secret}" onchange="updateAccount(${index}, 'client_secret', this.value)">
          
          <div class="grid-key">Technical username:</div>
          <input class="grid-value" type="text" value="${account.username}" onchange="updateAccount(${index}, 'username', this.value)">
          
          <div class="grid-key">Password:</div>
          <input class="grid-value" type="password" value="${account.password}" onchange="updateAccount(${index}, 'password', this.value)">
          
          <div class="parameters-box" style="grid-column: span 2; width: auto; grid-gap: 20px; box-shadow: none;"
          title="Période d'envoi dans Netilion des données enregistrées pour ce compte.
(toutes les x minutes, toutes les données enregistrées pour ce comptes seront poussées dans Netilion et supprimées localement)">
            <div class="grid-key">
              Période d'envoi <span style="font-weight: normal;"><br>(minutes)</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <select id="netilion-rate-mode-${index}">
                <option value="off" ${account.netilion_rate_mode === "off" ? "selected" : ""}>off</option>
                <option value="auto" ${account.netilion_rate_mode === "auto" ? "selected" : ""}>auto</option>
                <option value="personnalisé" ${account.netilion_rate_mode === "personnalisé" ? "selected" : ""}>personnalisé</option>
              </select>
              <input id="netilion-rate-input-${index}" value="${account.netilion_rate}" type="number" min="1" max="10080" onchange="updateAccount(${index}, 'netilion_rate', this.value)">
            </div>  
          </div>

          <button id="test-btn-${index}" class="btn btn-test" onclick="testConnection(${index})">Tester la connexion</button>
          <button class="btn btn-danger" onclick="deleteAccount(${index})">Supprimer</button>
          
          <div id="test-result-${index}"></div>
        `;
        
        container.appendChild(div);
        
        
        // Ajout d'une logique pour les champs concernant la période d'envoi dans Netilion 

        const select = div.querySelector(`#netilion-rate-mode-${index}`);
        const rateInput = div.querySelector(`#netilion-rate-input-${index}`);

        select.addEventListener("change", async () => {
          if (select.value === "auto") {
            await fetch(`/api/get_recommended_netilion_rate/${account.account_id}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                      rateInput.value = data.recommended_netilion_rate
                    } else if (data.status === "warning"){
                      showNotification(data.message, "warning", 6000)
                      rateInput.value = data.recommended_netilion_rate
                    }
              });
            rateInput.disabled = true;
            rateInput.style.opacity = 0.6; // optionnel : visuel
          } else if (select.value === "off"){
            rateInput.value = 0;
            rateInput.disabled = true;
            rateInput.style.opacity = 0.6; // optionnel : visuel
          } else {
            rateInput.disabled = false;
            rateInput.style.opacity = 1; // optionnel : visuel
            if (rateInput.value === 0) {
              rateInput.value = 1;
            } 
          }
          updateAccount(index, 'netilion_rate', rateInput.value)
          updateAccount(index, 'netilion_rate_mode', select.value)
        });

        // Pour que le comportement soit correct dès l’initialisation
        select.dispatchEvent(new Event("change"));
      });
    }

    function updateAccount(index, field, value) {
      // console.log("Update : ", field, value)
      if (["email", "client_id", "client_secret", "username", "password"].includes(field)) {
        // On marque quels champs ont été modifiés au fur et à mesure
        if (!accounts[index].hasChanged) {
          accounts[index].hasChanged = [];
        }    
        if (!accounts[index]['hasChanged'].includes(field)) {
          accounts[index]['hasChanged'].push(field);
        }

      } else if (field === "netilion_rate") {
        value = parseInt(value, 10)
        
      } 
      accounts[index][field] = value;
    }

    function addAccount() {
      // Récupérer tous les ID sous forme de nombres et les trier
      let usedIds = accounts.map(acc => parseInt(acc.id)).sort((a, b) => a - b);

      // Trouver le premier ID disponible
      let newId = 1;
      while (usedIds.includes(newId)) {
          newId++;
      }

      let newAccount = {
        identification: "Nouveau Compte",
        email: "",
        client_id: "",
        client_secret: "",
        username: "",
        password: "",
        access_token: "",
        refresh_token: "",
        token_expiry: 0,
        netilion_rate: 0,
        netilion_rate_mode: "off",
        bindable_objects: [],
        isNew: true
      };
      accounts.push(newAccount);
      renderAccounts();
    }

    function deleteAccount(index) {
      accounts.splice(index, 1);
      renderAccounts();
    }

    function saveAccounts() {
      
      fetch("/api/save_accounts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(accounts)
      }).then(response => response.json())
      .then(data => {
              if (data.status === "success") {
                showNotification("Configuration Netilion enregistrée.", "success");
                // location.reload();  // ⬅️ Recharge la page
                fetchAccounts();
                renderAccounts();
              } else {
                showNotification("Problème lors de l'enregistrement : " + data.message, "error", 6000)
              }
        }
    );
    }

    function testConnection(index) {
      let account = accounts[index];
      // account["hasChanged"] = hasChanged[index];
      let button = document.getElementById(`test-btn-${index}`);
      let resultDiv = document.getElementById(`test-result-${index}`);
      
      // affiche une animation (spinner) pour montrer que c'est en cours
      resultDiv.innerHTML = '<div class="spinner"></div>';

      fetch("/api/test_account_connection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(account)
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          button.style.backgroundColor = "#28a745"; // Vert
          showNotification("Connexion réussie !", "success");
          resultDiv.innerHTML = "";
        
          // Met à jour l'objet account avec la nouvelle valeur
          accounts[index].last_connection = data.last_connection;
        } else {
          button.style.backgroundColor = "#dc3545"; // Rouge
          showNotification("Échec de la connexion : " + data.error, "error", 6000)
          resultDiv.innerHTML = "";
        }
      })
      .catch(error => {
        button.style.backgroundColor = "#dc3545"; // Rouge
        console.error("Erreur:", error);
        showNotification("Échec de la connexion : " + error.message, "error", 6000)
        // resultDiv.innerHTML = "❌ Erreur inattendue : " + error;
      });
    }

    document.addEventListener("DOMContentLoaded", fetchAccounts);
  </script>

{% endblock %}


{% block content %}

<div class="container">
  <h1>Netilion Accounts</h1>
  <div id="accounts-container"></div>
  <div>
    <button class="btn" onclick="addAccount()">Ajouter un compte</button>
    <button class="btn" onclick="saveAccounts()">Enregistrer</button>
  </div>
  
</div>

{% endblock %}
