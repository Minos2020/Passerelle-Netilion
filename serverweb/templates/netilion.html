<!DOCTYPE HTML>
<html>
<head>
	<title>Netilion Accounts</title>
	<style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; flex-direction: column; margin: 0; background-color: #f4f4f9; color: #333; }
    .container { max-width: 90%; text-align: center ; align-items: center; padding: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; }
    h1 { font-size: 1.8em; color: #1971c2; margin-bottom: 50px; padding: 10px 50px;}
		.nav-bar { text-align: center; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; width: 90%; }
		.nav-bar a { justify-content: space-around; color: #1971c2; text-decoration: none; padding: 5px 30px; font-weight: bold; }
		.nav-bar a:hover { background: #b3ddf8; border-radius: 5px; }
    .nav-bar .a-logout {color: #000000;}
    .nav-bar .a-logout:hover {background: #f8a6a6;}
    #accounts-container { place-content: center; max-width: 100%; display: flex; flex-wrap: wrap; gap: 20px; margin: 20px 40px 10px; }

    .account-box { display: grid; grid-template-columns: 1fr 2fr; grid-gap: 5px; width:min-content; border: 1px solid #ccc; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .account-box:hover { transform: translateY(-5px); box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2); }
    .grid-key {padding: 5px 10px 5px;font-weight: bold;text-align: left; align-content: center; white-space: nowrap;}
    .grid-value { background: #fafafa; text-align: center; align-content: center; justify-content: center; white-space: nowrap; width: auto; padding: 5px; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; }
    .grid-footer {
        grid-column: span 2; /* Étend le titre sur les 2 colonnes */
        background: #cae5fd;
        text-align: center;
        justify-content: center;
        padding: 8px;
        border-radius: 8px;
        margin-bottom: 5px;
    }

    .btn { padding: 10px 20px; background: #1971c2; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 50; font-size: 14px; }
    .btn-danger { background: #c21d1d; width: auto; align-self: center; padding: 5px 10px; }
    .btn:hover { background-color: #0e5a91; }
    .btn-danger:hover { background-color: #a91d1d; }
    .account-header { display: flex; justify-content: space-between; align-items: center; }
    .account-header h3 { font-size: 18px; margin: 0; }
    .account-header button { background: transparent; border: none; font-size: 18px; color: #c21d1d; cursor: pointer; }
    .account-header button:hover { color: #a91d1d; }
	</style>

  <script>
    let accounts = [];

    function fetchAccounts() {
      fetch("/api/get_netilion_config")
        .then(response => response.json())
        .then(data => {
          accounts = data;
          renderAccounts();
        });
    }

    function renderAccounts() {
      let container = document.getElementById("accounts-container");
      container.innerHTML = ""; // Clear before rendering

      accounts.forEach((account, index) => {
        let div = document.createElement("div");
        div.classList.add("account-box");
        div.innerHTML = `
          <div class="grid-key">Identification:</div>
          <input class="grid-value" type="text" value="${account.identification}" onchange="updateAccount(${index}, 'identification', this.value)">
          
          <div class="grid-key">Client ID:</div>
          <input class="grid-value" type="text" value="${account.credentials.client_id}" onchange="updateAccount(${index}, 'client_id', this.value)">
          
          <div class="grid-key">Client Secret:</div>
          <input class="grid-value" type="password" value="${account.credentials.client_secret}" onchange="updateAccount(${index}, 'client_secret', this.value)">
          
          <div class="grid-key">Username:</div>
          <input class="grid-value" type="text" value="${account.credentials.username}" onchange="updateAccount(${index}, 'username', this.value)">
          
          <div class="grid-key">Password:</div>
          <input class="grid-value" type="password" value="${account.credentials.password}" onchange="updateAccount(${index}, 'password', this.value)">
          
          <button class="btn btn-danger grid-footer" onclick="deleteAccount(${index})">Supprimer</button>
        `;
        container.appendChild(div);
      });
    }

    function updateAccount(index, field, value) {
      if (["client_id", "client_secret", "username", "password"].includes(field)) {
        accounts[index].credentials[field] = value;
      } else {
        accounts[index][field] = value;
      }
    }

    function addAccount() {
      // Récupérer tous les ID sous forme de nombres et les trier
      let usedIds = accounts.map(acc => parseInt(acc.id)).sort((a, b) => a - b);

      // Trouver le premier ID disponible
      let newId = 1;
      while (usedIds.includes(newId)) {
          newId++;
      }

      let newAccount = {
        id: newId.toString(), // Utilise l'ID trouvé
        identification: "Nouveau Compte",
        credentials: {
          account_id: newId.toString(), // copie pour l'instant, A MODIFIER
          client_id: "",
          client_secret: "",
          username: "",
          password: "",
          access_token: "",
          refresh_token: "",
          token_expiry: 0
        },
        bindable_objects: []
      };
      accounts.push(newAccount);
      renderAccounts();
    }

    function deleteAccount(index) {
      accounts.splice(index, 1);
      renderAccounts();
    }

    function saveAccounts() {
      
      fetch("/api/save_netilion_config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(accounts)
      }).then(response => response.json())
      .then(data => {
              if (data.status === "success") {
                alert("✅ Configuration netilion enregistrée !");
              } else {
                alert("❌ Erreur lors de l'enregistrement !");
              }
            });
    }

    document.addEventListener("DOMContentLoaded", fetchAccounts);
  </script>
</head>
<body>
<!-- Bandeau de navigation -->
<div class="nav-bar">
  <a href="{{ url_for('web.overview') }}">Overview</a>
  <a href="{{ url_for('web.networks') }}">Networks</a>
  <a href="{{ url_for('web.modbus') }}">Modbus</a>
  <a href="{{ url_for('web.netilion') }}">Netilion Accounts</a>
  <a href="{{ url_for('web.bindings') }}">Bindings</a>
  <a href="{{ url_for('web.misc') }}">Miscellaneous</a>
  <a class="a-logout" href="{{ url_for('web.logout') }}">Logout</a>
</div>

  <div class="container">
    <h1>Netilion Accounts</h1>
    <div id="accounts-container"></div>
    <button class="btn" onclick="addAccount()">Ajouter un compte</button>
    <button class="btn" onclick="saveAccounts()">Enregistrer</button>
  </div>
</body>
</html>
