<!DOCTYPE HTML>
<html>
<head>
  <title>Device Settings</title>
  <style>
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; flex-direction: column; margin: 0; background-color: #f4f4f9; color: #333; }
    .main-container { width: 60%;   text-align: center ; align-items: center; padding: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; }
    .container { width: 90%;   text-align: center ; align-items: center; padding: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; }
    h1 { font-size: 1.8em; color: #1971c2; margin-bottom: 50px; padding: 10px 50px;}
    h2 { font-size: 1.2em; color: #333; margin: 10px 20px 20px; }
		.nav-bar { text-align: center; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; width: 90%; }
		.nav-bar a { justify-content: space-around; color: #1971c2; text-decoration: none; padding: 5px 30px; font-weight: bold; }
		.nav-bar a:hover { background: #b3ddf8; border-radius: 5px; }
    .nav-bar .a-logout {color: #000000;}
    .nav-bar .a-logout:hover {background: #f8a6a6;}
    p { font-size: 1.1em; margin: 10px 0; }
    input, select { padding: 8px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
    .flex-container { display: flex; align-items: center; }
    
    
    #networks-container { place-content: center; max-width: 100%; display: flex; flex-wrap: wrap; gap: 20px; margin: 20px 40px 10px; }
    .network-box { display: grid; grid-template-columns: 1fr 2fr; grid-gap: 5px; width:min-content; border: 1px solid #ccc; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1); }
    .network-box:hover { box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2); }
    .grid-key {padding: 5px 10px 5px;font-weight: bold;text-align: left; align-content: center; white-space: nowrap;}
    .grid-value { background: #fafafa; text-align: center; align-content: center; justify-content: center; white-space: nowrap; width: auto; padding: 5px; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; }
    .grid-header {
        grid-column: span 2; /* Étend le titre sur les 2 colonnes */
        background: #cae5fd;
        text-align: center;
        justify-content: center;
        font-weight: bold;
        padding: 8px;
        border-radius: 8px;
        margin-bottom: 5px;
    }
    .grid-footer {
        grid-column: span 2; /* Étend le titre sur les 2 colonnes */
        background: #cae5fd;
        text-align: center;
        justify-content: center;
        padding: 8px;
        border-radius: 8px;
        margin-bottom: 5px;
    }

    .btn { padding: 10px 20px; background: #1971c2; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 50; font-size: 14px; }
    .btn-danger { background: #c21d1d; width: auto; align-self: center; padding: 5px 10px; }
    .btn:hover { background-color: #0e5a91; }
    .btn-danger:hover { background-color: #a91d1d; }
	label {
    display: flex;
    flex-direction: column;
    text-align: left;
    margin-bottom: 10px; 
	}
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch("/api/get_networks_config")  // Récupération de la config actuelle
            .then(response => response.json())
            .then(data => {
                data.forEach((net, index) => {
                    document.getElementById(`ip-${index}`).value = net.ipadress;
                    document.getElementById(`subnet-${index}`).value = net.subnetmask;
                    document.getElementById(`gateway-${index}`).value = net.gateway;
                    document.getElementById(`dns-${index}`).value = net.dns;
                    document.getElementById(`dhcp-${index}`).value = net.dhcp;
                });
            });

        document.getElementById("network-form").addEventListener("submit", function (event) {
            event.preventDefault();
            const configData = [
                    {
                        identification: "configuration",
                        description: "This network configuration will be used to serve the configuration webserver",
                        ipadress: document.getElementById("ip-0").value,
                        subnetmask: document.getElementById("subnet-0").value,
                        gateway: document.getElementById("gateway-0").value,
                        dns: document.getElementById("dns-0").value,
                        dhcp: document.getElementById("dhcp-0").value
                    },
                    {
                        identification: "internet",
                        description: "This network configuration will be used to access Netilion and the NTP clock server",
                        ipadress: document.getElementById("ip-1").value,
                        subnetmask: document.getElementById("subnet-1").value,
                        gateway: document.getElementById("gateway-1").value,
                        dns: document.getElementById("dns-1").value,
                        dhcp: document.getElementById("dhcp-1").value
                    },
                    {
                        identification: "modbus",
                        description: "This network configuration will be used to access devices on the local modbus TCP network (if different than the internet access network",
                        ipadress: document.getElementById("ip-2").value,
                        subnetmask: document.getElementById("subnet-2").value,
                        gateway: document.getElementById("gateway-2").value,
                        dns: document.getElementById("dns-2").value,
                        dhcp: document.getElementById("dhcp-2").value
                    }
                ];

            fetch("/api/save_networks_config", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
              body: JSON.stringify(configData)
            }).then(response => response.json())
            .then(data => {
              if (data.status === "success") {
                alert("✅ Configuration réseaux enregistrée !");
              } else {
                alert("❌ Erreur lors de l'enregistrement !");
              }
            })

        });
    });
  </script>
</head>
<body>
<!-- Bandeau de navigation -->
<div class="nav-bar">
  <a href="{{ url_for('web.overview') }}">Overview</a>
  <a href="{{ url_for('web.networks') }}">Networks</a>
  <a href="{{ url_for('web.modbus') }}">Modbus</a>
  <a href="{{ url_for('web.netilion') }}">Netilion Accounts</a>
  <a href="{{ url_for('web.bindings') }}">Bindings</a>
  <a href="{{ url_for('web.misc') }}">Miscellaneous</a>
  <a class="a-logout" href="{{ url_for('web.logout') }}">Logout</a>
</div>

  <div class="main-container">
    <h1>Networks Settings</h1>
    <form id="network-form">
	<div id="networks-container">
      <div class="network-box">
        <div class="grid-header">Configuration webserver</div>
        <div class="grid-key">IP Address:</div>
        <input class="grid-value" type="text" id="ip-0"></label>
        <div class="grid-key">Subnet Mask:</div>
        <input class="grid-value" type="text" id="subnet-0"></label>
        <div class="grid-key">Gateway:</div>
        <input class="grid-value" type="text" id="gateway-0"></label>
        <div class="grid-key">DNS:</div>
        <input class="grid-value" type="text" id="dns-0"></label>
        <div class="grid-key">DHCP:</div>
        <select id="dhcp-0">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </div>

      <div class="network-box">
        <div class="grid-header">Internet access</div>
        <div class="grid-key">IP Address:</div>
        <input class="grid-value" type="text" id="ip-1"></label>
        <div class="grid-key">Subnet Mask:</div>
        <input class="grid-value" type="text" id="subnet-1"></label>
        <div class="grid-key">Gateway:</div>
        <input class="grid-value" type="text" id="gateway-1"></label>
        <div class="grid-key">DNS:</div>
        <input class="grid-value" type="text" id="dns-1"></label>
        <div class="grid-key">DHCP:</div>
        <select id="dhcp-1">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </div>

      <div class="network-box">
        <div class="grid-header">Modbus TCP network</div>
        <div class="grid-key">IP Address:</div>
        <input class="grid-value" type="text" id="ip-2"></label>
        <div class="grid-key">Subnet Mask:</div>
        <input class="grid-value" type="text" id="subnet-2"></label>
        <div class="grid-key">Gateway:</div>
        <input class="grid-value" type="text" id="gateway-2"></label>
        <div class="grid-key">DNS:</div>
        <input class="grid-value" type="text" id="dns-2"></label>
        <div class="grid-key">DHCP:</div>
        <select id="dhcp-2">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </div>
		</div>
		<div style="height: 20px;"></div>
		<button class="btn" type="submit">Save Configuration</button>
    </form>
  </div>
</body>
</html>
