<!DOCTYPE HTML>
<html>

<head>
  <title>Device Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      background-color: #f4f4f9;
      color: #333;
    }

    .main-container {
      width: 60%;
      text-align: center;
      align-items: center;
      padding: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      background: white;
      border-radius: 8px;
      margin: 10px;
    }

    .container {
      width: 90%;
      text-align: center;
      align-items: center;
      padding: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      background: white;
      border-radius: 8px;
      margin: 10px;
    }

    h1 {
      font-size: 1.8em;
      color: #1971c2;
      margin-bottom: 50px;
      padding: 10px 50px;
    }

    h2 {
      font-size: 1.2em;
      color: #333;
      margin: 10px 20px 20px;
    }

    .nav-bar {
      text-align: center;
      padding: 20px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      background: white;
      border-radius: 8px;
      margin: 10px;
      width: 90%;
    }

    .nav-bar a {
      justify-content: space-around;
      color: #1971c2;
      text-decoration: none;
      padding: 5px 30px;
      font-weight: bold;
    }

    .nav-bar a:hover {
      background: #b3ddf8;
      border-radius: 5px;
    }

    .nav-bar .a-logout {
      color: #000000;
    }

    .nav-bar .a-logout:hover {
      background: #f8a6a6;
    }

    p {
      font-size: 1.1em;
      margin: 10px 0;
    }

    input,
    select {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .flex-container {
      display: flex;
      align-items: center;
    }

    #networks-container {
      place-content: center;
      align-items: center;
      max-width: 100%;
      display: flex;
      flex: 1;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 40px 10px;
    }

    .network-card {
      display: grid;
      grid-template-columns: 1fr 2fr;
      grid-gap: 5px;
      width:max-content;
      border: 1px solid #ccc;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
      cursor: grab;
      transition: box-shadow 0.3s;
    }

    .network-card:hover {
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
    }

    .grid-key {
      padding: 0 10px 0;
      font-weight: bold;
      text-align: left;
      align-content: center;
      white-space: nowrap;
    }

    .grid-value {
      text-align: right;
      align-content: center;
      justify-content: center;
      white-space: nowrap;
      width: auto;
      padding: 0 10px 0;
    }

    .grid-header {
      grid-column: span 2;
      /* Étend le titre sur les 2 colonnes */
      background: #cae5fd;
      text-align: center;
      justify-content: center;
      font-weight: bold;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 5px;
    }

    .grid-footer {
      grid-column: span 2;
      /* Étend le titre sur les 2 colonnes */
      background: #cae5fd;
      text-align: center;
      justify-content: center;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 5px;
    }

    .btn {
      padding: 10px 20px;
      background: #1971c2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      width: 50;
      font-size: 14px;
    }

    .btn-danger {
      background: #c21d1d;
      width: auto;
      align-self: center;
      padding: 5px 10px;
    }

    .btn:hover {
      background-color: #0e5a91;
    }

    .btn-danger:hover {
      background-color: #a91d1d;
    }

    label {
      display: flex;
      flex-direction: column;
      text-align: left;
      margin-bottom: 10px;
    }

    .slot {
      border-radius: 10px;
      padding: 20px;
      width: 300px;
      min-height: 150px;
      margin: 20px;
      text-align: center;
      transition: border-color 0.3s;
    }

    .slot.drag-over {
      border: 2px dashed #ccc;
    }

    .slot.hovered {
      border-color: rgb(38, 131, 207);
    }
  </style>
  <script>
        function allowDrop(ev) {
          ev.preventDefault();
          ev.currentTarget.classList.add("hovered");
        }

        function leaveDrop(ev) {
          ev.currentTarget.classList.remove("hovered");
        }

        function drag(ev) {
          const modbus_slot = document.getElementById("modbus-slot");
          const available_slot = document.getElementById("interface-list");
          modbus_slot.classList.add("drag-over"); // Ajoute la bordure
          available_slot.classList.add("drag-over"); // Ajoute la bordure
          ev.dataTransfer.setData("text/plain", ev.target.id);
        }

        function dragend(ev) {
          const modbus_slot = document.getElementById("modbus-slot");
          const available_slot = document.getElementById("interface-list");
          modbus_slot.classList.remove("drag-over"); // Supprime la bordure
          available_slot.classList.remove("drag-over"); // Ajoute la bordure
        }

        function drop(ev) {
          ev.preventDefault();
          ev.currentTarget.classList.remove("hovered");
          const data = ev.dataTransfer.getData("text");
          const draggedElement = document.getElementById(data);
          const dropzone = document.getElementById("modbus-slot");
          const placeholder = document.getElementById("modbus-placeholder");

          const currentContainer = ev.currentTarget;

          // Vérifie s’il y a déjà une carte dans le slot
          const existingCard = currentContainer.querySelector(".network-card");
          if (existingCard) {
              // Renvoie l’ancienne carte dans la zone dispo
              document.getElementById("interface-list").appendChild(existingCard);
          }

          ev.currentTarget.appendChild(draggedElement);

          if (dropzone.children.length > 0) {
            placeholder.style.display = "none";
          } else {
            placeholder.style.display = "inline";
          }  
        }

        document.addEventListener("DOMContentLoaded", function () {
          fetch("/api/get_networks_config")
            .then(response => response.json())
            .then(data => {
              const container = document.getElementById("interface-list");
              container.innerHTML = "";
              data.forEach((net, index) => {
                const card = document.createElement("div");
                card.className = "network-card";
                card.id = "iface-" + index;
                card.draggable = true;
                card.ondragstart = drag;
                card.ondragend = dragend;

                card.innerHTML = `
                  <div class="grid-header">${net.description || "Interface " + index}</div>
                  <div class="grid-key">IP:</div><div class="grid-value">${net.ipadress}</div>
                  <div class="grid-key">Subnet:</div><div class="grid-value">${net.subnetmask}</div>
                  <div class="grid-key">Gateway:</div><div class="grid-value">${net.gateway}</div>
                  <div class="grid-key">Internet:</div><div class="grid-value">${net.internet_access}</div>
                `;

                container.appendChild(card);
              });
            });
        });

        fetch("/api/save_networks_config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(configData)
        }).then(response => response.json())
          .then(data => {
            if (data.status === "success") {
              alert("✅ Configuration réseaux enregistrée !");
            } else {
              alert("❌ Erreur lors de l'enregistrement !");
            }
        })

  </script>
</head>

<body>
  <!-- Bandeau de navigation -->
  <div class="nav-bar">
    <a href="{{ url_for('web.overview') }}">Overview</a>
    <a href="{{ url_for('web.networks') }}">Networks</a>
    <a href="{{ url_for('web.modbus') }}">Modbus</a>
    <a href="{{ url_for('web.netilion') }}">Netilion Accounts</a>
    <a href="{{ url_for('web.bindings') }}">Bindings</a>
    <a href="{{ url_for('web.misc') }}">Miscellaneous</a>
    <a class="a-logout" href="{{ url_for('web.logout') }}">Logout</a>
  </div>

  <div class="main-container">
    <h1>Networks Settings</h1>

    <div style="display: flex; gap: 50px;">
      <!-- Colonne gauche : interfaces -->
      <div id="left-column" style="flex: 1 1 40%; min-width: 300px;">
        <h2>Available Interfaces</h2>
        <div id="networks-container">
          <div id="interface-list" class="slot" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)"></div>
        </div>
      </div>
      <!-- Colonne droite : slot Modbus -->
      <div id="right-column" style="flex: 1 1 40%; min-width: 300px;">
        <h2>Used for Modbus TCP</h2>
        <div id="networks-container">
          <div id="modbus-slot" class="slot" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
            <p id="modbus-placeholder">Drop the interface that should be used for Modbus</p>
          </div>
        </div>
      </div>
    </div>

  </div>

      <button class="btn" type="submit">Save Configuration</button>

  </div>
</body>

</html>
