<!DOCTYPE html>
<html>
<head>
    <title>Connection</title>
    <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; flex-direction: column; margin: 0; background-color: #f4f4f9; color: #333; }
    .container { width: auto; text-align: center ; align-items: center; padding: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; }
    h1 { font-size: 1.8em; color: #1971c2; margin-bottom: 50px; padding: 10px 50px;}
    h2 { font-size: 1.5em; color: #333; margin: 10px 20px 20px; }
    p { font-size: 1.1em; margin: 10px 0; }
    button { padding: 8px 12px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
    input, select { padding: 8px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
    .flex-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
  <div class='flex-container'>
    <div class='container'>
      <h2>Connection</h2>
      <form method='POST' action='/login'>
        <label>Login:</label>
        <input type='text' name='username' required><br><br>
        <label>Password:</label>
        <input type='password' name='password' required><br><br>
        <button type="submit">Connect</button>
      </form>
    </div>
      {% if error %}
        <i><h2 style="font-size: 16px; color: red;">{{ error }}</h2></i>
      {% endif %}
    
  </div>
</body>
</html>
