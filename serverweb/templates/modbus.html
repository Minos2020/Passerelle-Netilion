{% extends "base.html" %}
{% block title %}Réglages généraux{% endblock %}

{% block extra_styles %}

  <style>
    
    .container { width: max-content; max-width: 90%;}
      
		
    p { font-size: 1.1em; margin: 10px 0; }
    
    input, select { padding: 8px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
    .flex-container { display: flex; align-items: center; }
    .parameter-container { padding: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 30px 20px 10px; }
    
    #main-container { place-content: center; max-width: 100%; display: flex; flex-direction:column;flex-wrap: wrap; gap: 20px; margin: 20px 40px 10px; }
    
    
    .grid-value {
      background: #fafafa;
      text-align: center;
      padding: 5px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    .grid-header {
        grid-column: span 2; /* Étend le titre sur les 2 colonnes */
        background: #cae5fd;
        text-align: center;
        justify-content: center;
        font-weight: bold;
        padding: 8px;
        border-radius: 8px;
        margin-bottom: 5px;
    }
    
  </style>

{% endblock %}
  

{% block extra_scripts %}

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const modeToggle = document.getElementById("mode-toggle");
      // const encrToggle = document.getElementById("encryption-toggle");
      const modeToggleLabel = document.getElementById("mode-toggle-label");
      // const encrToggleLabel = document.getElementById("encryption-toggle-label");

      fetch("/api/get_general_config")
        .then(response => response.json())
        .then(data => {
          document.getElementById("rate").value = data.modbus_rate;
          
          const isProduction = data.mode === "production";
          modeToggle.checked = isProduction;
          modeToggleLabel.textContent = isProduction ? "Mode production" : "Mode configuration";
          
          // encrToggle.checked = data.encryption;
          // encrToggleLabel.textContent = data.encryption ? "Configuration chiffrée" : "Configuration en clair";
          
        });

        modeToggle.addEventListener("change", function () {
          if (this.checked) {
            modeToggleLabel.textContent = "Mode production ON";
            
          } else {
            modeToggleLabel.textContent = "Mode production OFF";
          }
        });
        
        // encrToggle.addEventListener("change", function () {
        //   if (this.checked) {
        //     encrToggleLabel.textContent = "Configuration chiffrée";
            
        //   } else {
        //     encrToggleLabel.textContent = "Configuration en clair";
        //   }
        // });

      document.getElementById("parameters-form").addEventListener("submit", function (event) {
        event.preventDefault();
        const configData = {
          modbus_rate: parseInt(document.getElementById("rate").value, 10),
          mode: document.getElementById("mode-toggle").checked ? "production" : "configuration",
          // encryption: document.getElementById("encryption-toggle").checked
        };

        fetch("/api/save_general_config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(configData)
        }).then(response => response.json())
          .then(data => {
            if (data.status) {
              showNotification("Enregistrement réussi", "success");
              if (document.getElementById("mode-toggle").checked) showNotification("Mode PRODUCTION", "info");
            } else {
              showNotification("Erreur lors du téléchargement du fichier :" + data.message, "error", 6000);
            }
          })
      });

    });

    function notImplementedYet(){
      showNotification("Modbus RTU non supporté actuellement", "warning")
    }

    
    // POUR TESTS
    function read_modbus(){
      fetch("/api/read_modbus")
      showNotification("Lecture Modbus", "warning")
    }
    function send_data(){
      fetch("/api/send_data")
      showNotification("Envoi compte 2", "warning")
    }

  </script>
  
  {% endblock %}


{% block content %}

<div class="container">
  <h1>Réglages généraux</h1>
  <form id="parameters-form">
    <div id="main-container">
      <div class="switch-container" title="En mode production les bindings sont 'activés', ce qui signifie que les requêtes Modbus et HTTPS à Netilion sont envoyées selon les intervalles paramétrés dans la configuration.">
          <label class="switch">
            <input type="checkbox" id="mode-toggle">
            <span class="slider round"></span>
          </label>
          <span id="mode-toggle-label" style="min-width: 175px;">...</span>
        </div>
        <!-- <div class="switch-container" title="Si activé, le fichier de configuration est crypté (au téléchargement, au chargement et sur la machine)
Si désactivé il est en clair.">
          <label class="switch">
            <input type="checkbox" id="encryption-toggle">
            <span class="slider round"></span>
          </label>
          <span id="encryption-toggle-label" style="min-width: 175px;">...</span>
        </div> -->

      <div class="parameters-box" title="Période d'interrogation des registres modbus pour chaque binding.
(toutes les x secondes, chacun des registres configurés dans les bindings sera interrogé)
Cette période est commune à tous les bindings.">
        <div class="grid-key">Fréquence d'interrogation (s)</div>
        <input class="grid-value" type="number" id="rate" name="rate" min="1" max="1800" value="1">
        <!-- <div class="grid-key">Wait Delay (s)</div>
        <input class="grid-value" type="number" id="waitdelay" name="waitdelay" min="1" max="60" value="1"> -->
      </div>

    <div class="parameters-box" style="align-self: center;" onclick="notImplementedYet()">
      <div class="grid-header">Modbus RTU</div>
      <div class="grid-key">Baudrate</div>
      <select id="baudrate" name="baudrate">
        <option value="9600">9600</option>
        <option value="19200">19200</option>
        <option value="38400">38400</option>
        <option value="57600">57600</option>
        <option value="115200">115200</option>
      </select>

      <div class="grid-key">Parity</div>
      <select id="parity" name="parity">
        <option value="0">None</option>
        <option value="1">Odd</option>
        <option value="2">Even</option>
      </select>

      <div class="grid-key">Stop Bits</div>
      <select id="stopbits" name="stopbits">
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </div>
</div>
<div style="height: 20px;"></div>
<button class="btn" type="submit">Save Configuration</button>
</form>

<!-- POUR TESTS -->
<!-- <button class="btn" style="margin-top: 20px;" onclick="read_modbus()">Lire modbus</button>
<button class="btn" style="margin-top: 20px;" onclick="send_data()">Envoyer Netilion Compte 2</button> -->


</div>

{% endblock %}
