<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Passerelle Netilion{% endblock %}</title>

    <!-- Lien vers la feuille de style commune -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

    
    <!-- Styles communs -->
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; flex-direction: column; margin: 0; background-color: #f4f4f9; color: #333; }
		.container { display: flex; flex-direction: column; width: 90%; text-align: center; align-items: center; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; }
		.container-internal {display: flex; flex-direction: column; width: max-content; max-width: 90%; text-align: center; align-items: center; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px;}
        .cards-container { place-content: center; max-width: 100%; display: flex; flex-wrap: wrap; gap: 20px; margin: 20px 0px 10px; }
        h1 { color: #1971c2; }
		.nav-bar {
			text-align: center;
			padding: 20px;
			box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
			background: white;
			border-radius: 8px;
			margin: 10px;
			width: 90%;
			max-width: 100%;
			display: flex;
			flex-wrap: wrap; /* Permet aux éléments de passer à la ligne si nécessaire */
			justify-content: center; /* Centrer les éléments */
		}.nav-bar > a {
			color: #1971c2;
			text-decoration: none;
			padding: 5px 20px;
			font-weight: bold;
			overflow: hidden;
			max-width: 100%;  /* Limite la largeur des éléments à la largeur du parent */
			min-width: 100px;  /* Définit une largeur minimale pour éviter que le texte soit trop petit */
			box-sizing: border-box; /* Inclut les paddings dans la largeur totale */
		}
        .nav-bar a:hover { background: #b3ddf8; border-radius: 5px; }
        .nav-bar .a-logout {color: #000000;}
        .nav-bar .a-logout:hover {background: #f8a6a6;}
        
        .grid-key {padding: 5px 10px 5px;font-weight: bold;text-align: left; align-content: center; white-space: nowrap;}
        .grid-value {
            text-align: right;
            align-content: center;
            justify-content: center;
            white-space: nowrap;
            width: auto;
            padding: 2px 10px 2px;
        }

        .btn { padding: 10px 20px; background: #1971c2; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;  font-size: 14px; }
        .btn-danger { background: #c21d1d; width: auto; align-self: center; padding: 5px 10px; }
        .btn:hover { background-color: #0e5a91; }
        .btn-danger:hover { background-color: #a91d1d; }
        .btn-test { white-space: nowrap; background: #818181; width: auto; align-self: center; padding: 5px 10px; }
		.btn-test:hover { background-color: #585858; }


        /* Autres styles globaux... */
        
    </style>
    
    <!-- Bloc pour les scripts spécifiques à chaque page -->
    {% block extra_styles %}
    {% endblock %}

    <script>
        // Script global (par exemple, pour la gestion des erreurs)
        
        // Fonction pour afficher une notification
        function showNotification(message, type = "info", duration = 3000) {
            const container = document.getElementById("notification-container");
            if (!container) return;

            const notification = document.createElement("div");
            // Ajoute la classe de base "notification", et la classe dynamique selon le type voulu
            notification.classList.add("notification", type);

            const closeButton = document.createElement("span");
            closeButton.classList.add("close-btn");
            closeButton.innerHTML = "&times;";
            closeButton.onclick = () => container.removeChild(notification);

            const messageSpan = document.createElement("span");
            messageSpan.textContent = message;

            notification.appendChild(messageSpan);
            notification.appendChild(closeButton);
            container.appendChild(notification);

            setTimeout(() => {
                if (container.contains(notification)) {
                container.removeChild(notification);
                }
            }, duration);
        }



        // Exemple d'utilisation (affiche une notification de succès)
        showNotification('Action réussie !', 'success');
    </script>
    
    <!-- Bloc pour les scripts spécifiques à chaque page -->
    {% block extra_scripts %}{% endblock %}

</head>
<body>
    <!-- Conteneur pour les notifications -->
    <div id="notification-container" class="notification-container"></div>
    
    <!-- Bandeau de navigation -->
    <div class="nav-bar">
        <a href="{{ url_for('web.overview') }}">Résumé</a>
        <a href="{{ url_for('web.networks') }}">Réseaux</a>
        <a href="{{ url_for('web.modbus') }}">Divers</a>
        <a href="{{ url_for('web.netilion') }}">Comptes Netilion</a>
        <a href="{{ url_for('web.bindings') }}">Bindings</a>
        <a class="a-logout" href="{{ url_for('web.logout') }}">Déconnexion</a>
    </div>
    
    <!-- Contenu injecté depuis les pages spécifiques -->
    {% block content %}
    {% endblock %}

    <!-- JS commun pour notifications ou autres -->
    <!-- <script src="{{ url_for('static', filename='notifications.js') }}"></script> -->
</body>
</html>
