<!DOCTYPE HTML>
<html>
<head>
	<title>Netilion Accounts</title>
	<style>
		body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; flex-direction: column; margin: 0; background-color: #f4f4f9; color: #333; }
		.container { width: 90%; text-align: center; align-items: center; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); background: white; border-radius: 8px; margin: 10px; }
		h1 { font-size: 1.8em; color: #1971c2; margin-bottom: 20px; padding: 10px 50px; }
		.nav-bar {
			text-align: center;
			padding: 20px;
			box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
			background: white;
			border-radius: 8px;
			margin: 10px;
			width: 90%;
			max-width: 100%;
			display: flex;
			flex-wrap: wrap; /* Permet aux éléments de passer à la ligne si nécessaire */
			justify-content: center; /* Centrer les éléments */
		}.nav-bar > a {
			color: #1971c2;
			text-decoration: none;
			padding: 5px 20px;
			font-weight: bold;
			overflow: hidden;
			max-width: 100%;  /* Limite la largeur des éléments à la largeur du parent */
			min-width: 100px;  /* Définit une largeur minimale pour éviter que le texte soit trop petit */
			box-sizing: border-box; /* Inclut les paddings dans la largeur totale */
		}
		.nav-bar a:hover { background: #b3ddf8; border-radius: 5px; }
		.nav-bar .a-logout {color: #000000;}
		.nav-bar .a-logout:hover {background: #f8a6a6;}
		.table { width: 100%; border-collapse: collapse; margin-top: 20px; }
		.table-header,
		.table-row { display: grid; grid-template-columns: repeat(12, 1fr);  align-items: center; gap: 20px; padding: 8px; border-bottom: 1px solid #ddd; }
		.table-header { background: #e0e0e0; }

		.table-header > div { font-weight: bold; overflow: hidden; }
		.table-double {grid-column: span 2;}
		/* .table-header > div, */

		.table-row input { width: 95%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
		.table-row select { width: 95%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
		.btn { padding: 10px 20px; background: #1971c2; color: white; border: none; border-radius: 5px; cursor: pointer;  font-size: 14px; }
		.btn-danger { background: #c21d1d; align-self: center; padding: 5px 10px; overflow:hidden; max-width: 100%;}
		.btn:hover { background-color: #0e5a91; }
		.btn-test { background: #a3a3a3; width: auto; align-self: center; padding: 5px 10px; }
		.btn-test:hover { background-color: #585858; }
		.btn-danger:hover { background-color: #a91d1d; }

	</style>

	<script>
		let bindings = [];
		let accounts = [];
		let units = []; // Contiendra toutes les unités Netilion
		let unitsLoaded = false;

		// Fonction pour charger les unités depuis le fichier
		async function loadUnits() {
			try {
				let response = await fetch("/api/get_units"); // Mets le bon chemin ici
				units = await response.json();
				unitsLoaded = true; // Marque comme chargé
				console.log("Units loaded:", units.length); // Debug
			} catch (error) {
				console.error("Erreur lors du chargement des unités :", error);
			}
		}

		// Charger les unités immédiatement au démarrage
		const unitsPromise = loadUnits();

		function fetchData() {
			Promise.all([
				fetch("/api/get_accounts").then(res => res.json()),
				fetch("/api/get_bindings").then(res => res.json())
			])
				.then(([netilionData, bindingsData]) => {
					accounts = netilionData;
					bindings = bindingsData;
					renderBindings();
				})
				.catch(error => console.error("Erreur lors du chargement des données:", error));
		}

		async function renderBindings() {
			let container = document.getElementById("bindings-list");
			container.innerHTML = ""; // Nettoyage avant affichage

			// S'assurer que les unités sont chargées avant de continuer
			if (!unitsLoaded) {
				console.log("Attente du chargement des unités...");
				await unitsPromise; // Attendre le chargement
			}

			bindings.forEach((binding, index) => {
				let row = document.createElement("div");
				row.classList.add("table-row");

				// Récupérer les bindable_objects du compte Netilion lié à ce binding
				let netilionAccount = accounts.find(acc => acc.account_id === binding.netilion_account_id);
				let bindableOptions = netilionAccount ? netilionAccount.assets : [];
				
				row.innerHTML = `
					<div><input type="text" value="${binding.identification}" onchange="updateBinding(${index}, 'identification', this.value)"></div>
					<div>
						<select onchange="updateBinding(${index}, 'protocol', this.value)">
							<option value="RTU" ${binding.protocol === "RTU" ? "selected" : ""}>RTU</option>
							<option value="TCP" ${binding.protocol === "TCP" ? "selected" : ""}>TCP</option>
						</select>
					</div>
					<div><input type="text" value="${binding.slaveadress}" onchange="updateBinding(${index}, 'slaveadress', this.value)"></div>
					<div><input type="text" value="${binding.registeradress}" onchange="updateBinding(${index}, 'registeradress', this.value)"></div>
					<div>
						<select onchange="updateBinding(${index}, 'datatype', this.value)">
							<option value="INT16" ${binding.datatype === "INT16" ? "selected" : ""}>INT16</option>
							<option value="UINT16" ${binding.datatype === "UINT16" ? "selected" : ""}>UINT16</option>
							<option value="INT32_B" ${binding.datatype === "INT32_B" ? "selected" : ""}>INT32_B</option>
							<option value="INT32_L" ${binding.datatype === "INT32_L" ? "selected" : ""}>INT32_L</option>
							<option value="UINT32_B" ${binding.datatype === "UINT32_B" ? "selected" : ""}>UINT32_B</option>
							<option value="UINT32_L" ${binding.datatype === "UINT32_L" ? "selected" : ""}>UINT32_L</option>
							<option value="FLOAT_B" ${binding.datatype === "FLOAT_B" ? "selected" : ""}>FLOAT_B</option>
							<option value="FLOAT_L" ${binding.datatype === "FLOAT_L" ? "selected" : ""}>FLOAT_L</option>
							<option value="DOUBLE_B" ${binding.datatype === "DOUBLE_B" ? "selected" : ""}>DOUBLE_B</option>
							<option value="DOUBLE_L" ${binding.datatype === "DOUBLE_L" ? "selected" : ""}>DOUBLE_L</option>
						</select>
					</div>
					<div class= "table-double">
						<input type="text" list="units-list-${index}" value="${binding.unit || ''}" 
							oninput="updateBinding(${index}, 'unit', this.value)">
						<datalist id="units-list-${index}">
							${units.map(unit => `<option value="${unit.name} (${unit.symbol})" label="${unit.name} (${unit.symbol})"></option>`).join("")}
						</datalist>
					</div>
					<div>
						<button id="test-btn-${index}" class="btn btn-test" onclick="testBinding(${index})">Test</button>
					</div>
					<div>
						<span id="test-result-${index}" style=" align-self: center;"></span>
					</div>
					<div>
						<select onchange="updateBinding(${index}, 'netilion_account_id', this.value, true)">
							${accounts.map(acc => `<option value="${acc.account_id}" ${acc.account_id === binding.netilion_account_id ? "selected" : ""}>${acc.identification}</option>`).join("")}
						</select>
					</div>
					<div>
						<select onchange="updateBinding(${index}, 'netilion_binding_id', this.value, true)">
							${bindableOptions.map(obj => `<option value="${obj.id}" ${obj.id === binding.netilion_binding_id ? "selected" : ""}>${obj.description || obj.serial_number || obj.tag}</option>`).join("")}
						</select>
					</div>
					
					<button class="btn btn-danger" onclick="deleteBinding(${index})">Supprimer</button>
					
				`;

				container.appendChild(row);
			});
		}
		

		function updateBinding(index, field, value, render) {
			if (field === "netilion_account_id") {
				bindings[index][field] = parseInt(value);  // <- ici
				bindings[index].netilion_binding_id = null;
			} else {
				bindings[index][field] = value;
			}

			if (render){
				renderBindings(); // Pour rafraîchir les objets Netilion associés
			}
			
		}

		function addBinding() {
			let newBinding = {
				identification: "Nouveau Binding",
				protocol: "TCP",
				slaveadress: "",
				registeradress: "",
				datatype: "INT16",
				unit_id: "",
				netilion_account_id: accounts.length > 0 ? accounts[0].id : "",
				netilion_binding_id: "",
			};
			bindings.push(newBinding);
			renderBindings();
		}

		function deleteBinding(index) {
			bindings.splice(index, 1);
			renderBindings();
		}

		function saveBindings() {
			fetch("/api/save_bindings", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(bindings)
			})
				.then(response => response.json())  // Convertit la réponse en JSON
				.then(data => {
					if (data.status === "success") {
						alert("✅ Bindings enregistrés !");
					} else {
						alert(`❌ Erreur lors de l'enregistrement : ${data.message || "Erreur inconnue"}`);
					}
				})
				.catch(error => console.error("Erreur lors de l'enregistrement:", error));
		}

		document.addEventListener("DOMContentLoaded", fetchData);

		async function testBinding(index) {
			let binding = bindings[index];
			let button = document.getElementById(`test-btn-${index}`);
			let resultSpan = document.getElementById(`test-result-${index}`);

			// Reset visuel avant de tester
			button.style.backgroundColor = "#1971c2";
			resultSpan.innerText = "Test en cours...";
			resultSpan.style.color = "#333";

			try {
				let response = await fetch("/api/modbus_test", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						protocol: binding.protocol,
						slaveadress: binding.slaveadress,
						registeradress: binding.registeradress,
						datatype: binding.datatype,
						identification: binding.identification
					})
				});

				let data = await response.json();
				if (response.ok && data.status === "success") {
					button.style.backgroundColor = "#28a745"; // Vert
					resultSpan.innerText = `${data.value}`;
					resultSpan.style.color = "#28a745";
				} else if (response.ok && data.status === "error") {
					button.style.backgroundColor = "#dc3545"; // Rouge
					resultSpan.innerText = `Échec : ${data.type}`;
					resultSpan.style.color = "#dc3545";
				}
			} catch (error) {
				button.style.backgroundColor = "#dc3545"; // Rouge
				resultSpan.innerText = "Erreur";
				resultSpan.style.color = "#dc3545";
			}
		}

	</script>
</head>
<body>
    <!-- Bandeau de navigation -->
    <div class="nav-bar">
        <a href="{{ url_for('web.overview') }}">Overview</a>
        <a href="{{ url_for('web.networks') }}">Networks</a>
        <a href="{{ url_for('web.modbus') }}">General</a>
        <a href="{{ url_for('web.netilion') }}">Netilion Accounts</a>
        <a href="{{ url_for('web.bindings') }}">Bindings</a>
		<a class="a-logout" href="{{ url_for('web.logout') }}">Logout</a>
    </div>

    <div class="container">
        <h1>Bindings</h1>

        <!-- En-tête des colonnes -->
        <div class="table-header">
            <div>Identification</div>
            <div>Protocole</div>
            <div>Slave Address</div>
            <div>Register Address</div>
            <div>Data Type</div>
			<div class= "table-double">Unit</div>
			<div></div>
			<div></div>
            <div>Compte Netilion</div>
            <div>Objet Bindable</div>
            <div></div>
        </div>

        <!-- Conteneur des bindings -->
        <div id="bindings-list"></div>

        <!-- Bouton pour ajouter un binding -->
        <button class="btn" style="margin-top: 20px;" onclick="addBinding()">Ajouter un binding</button>
		<button class="btn" style="margin-top: 20px;" onclick="saveBindings()">Enregistrer</button>
    </div>
</body>
</html>
